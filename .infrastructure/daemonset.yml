apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube2py
  namespace: mateapp
  labels:
    app: kube2py
spec:
  selector:
    matchLabels:
      app: mate-server
  template: 
    metadata:
      labels: 
        app: mate-server
    spec:
      containers:
        - name: curl
          image: radial/busyboxplus:curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null -w "%{http_code}\n" http://todoapp-service.mateapp.svc.cluster.local:80/
                sleep 5
              done
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
