apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-healthcheck
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate: 
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: radial/busyboxplus.curl
              command: ["/bin/sh", "-c"]
              args:
                - curl -sf http://todoapp-service.mateapp.svc.cluster.local:80/api/health
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi